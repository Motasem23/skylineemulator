name: Build Android App

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    # Using ubuntu-22.04 avoids newer host CMake 3.31 override issues
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository with all Git submodules recursively
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install specific NDK, CMake, and Ninja via sdkmanager
      - name: Install Android NDK & CMake
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;25.0.8775105" \
            "cmake;3.22.1" \
            "build-tools;33.0.0"

      # 5. Export NDK Environment Variable
      - name: Set Environment Variables
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.0.8775105" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_HOME}/ndk/25.0.8775105" >> $GITHUB_ENV

      # 6. Cache Gradle wrapper and dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 7. Grant execute permissions to gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 8. Build APK (compiles Native C++ code via CMake/Ninja)
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # 9. Upload generated APK as artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
